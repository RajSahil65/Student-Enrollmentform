<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Enrollment Form - JsonPowerDB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Enrollment Form</h1>
        <form id="stuForm" onsubmit="return false;">
            <label for="rollNo">Roll-No</label>
            <input type="number" id="rollNo" placeholder="Enter Roll No">

            <label for="fullName">Full-Name</label>
            <input type="text" id="fullName" placeholder="Enter Full Name">

            <label for="stuClass">Class</label>
            <input type="text" id="stuClass" placeholder="Enter Class">

            <label for="birthDate">Birth-Date</label>
            <input type="date" id="birthDate">

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter Address">

            <label for="enrollDate">Enrollment-Date</label>
            <input type="date" id="enrollDate">

            <div class="buttons">
                <button type="button" id="save">Save</button>
                <button type="button" id="update">Update</button>
                <button type="button" id="reset">Reset</button>
            </div>
            <p id="msg"></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
